<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Phishing Awareness Dashboard</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #e8f2fa;
            color: #32475d;
            transition: background-color 0.4s ease, color 0.4s ease;
            padding-bottom: 2rem;
        }

        .content-wrapper {
            width: 82%;
            max-width: 1100px;
            margin: 0 auto;
            transition: all 0.4s ease;
            padding-bottom: 2rem;
        }

        @media (max-width: 1000px) {
            .content-wrapper {
                width: 100%;
                max-width: 100%;
                padding: 0 1rem;
            }
        }

        .card, .table-wrapper, .form-section, .notification-item, .step, .schedule-preview {
            border-radius: 18px;
            border: 1px solid rgba(81, 110, 138, 0.18);
            background: #f5f9fd;
            box-shadow: 0 14px 30px rgba(73, 102, 134, 0.08);
            transition: all 0.35s ease;
        }

        .card-body,
        .form-section,
        .schedule-preview,
        .notification-item {
            background: rgba(243, 249, 255, 0.95);
        }

        .card-header {
            background: #eef5fb;
            border-bottom: 1px solid rgba(81, 110, 138, 0.18);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #ecf5fb;
            border: none;
            box-shadow: none;
        }

        table {
            width: 100%;
            table-layout: auto;
            transition: all 0.4s ease;
        }

        th, td {
            font-size: 14px;
            padding: 0.75rem;
            vertical-align: middle;
            transition: background-color 0.3s ease;
        }

        thead th {
            background: #d9e7f2;
            color: #3d5f7f;
            border-bottom: 1px solid rgba(81, 110, 138, 0.18);
        }

        table.table-striped tbody tr:nth-of-type(odd) {
            background: rgba(230, 243, 252, 0.7);
        }

        #rowCount {
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: #4f6b86;
        }

        .controls select,
        .controls button {
            transition: all 0.3s ease;
        }

        .user-logout {
            position: absolute;
            top: 1rem;
            right: 1rem;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
            z-index: 10;
        }

        .user-logout,
        .password-input-wrapper,
        .service-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .user-logout {
            position: absolute;
            top: 1rem;
            right: 1rem;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
            z-index: 10;
        }

        .password-toggle input[type="checkbox"] {
            margin: 0;
            width: 1rem;
            height: 1rem;
        }

        .protocol-badge,
        .status-badge,
        .btn,
        .form-control,
        .form-select,
        textarea,
        .upload-area {
            border-radius: 14px;
        }

        .form-control,
        .form-select,
        textarea {
            border-color: rgba(81, 110, 138, 0.18);
            background: #eef5fb;
            color: #32475d;
        }

        textarea {
            font-family: monospace;
        }

        .form-section {
            background: #eef5fb;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .upload-area {
            min-height: 150px;
            border: 1px dashed rgba(81, 110, 138, 0.3);
            background: rgba(227, 240, 250, 0.55);
            padding: 1rem;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: rgba(81, 110, 138, 0.6);
            background: rgba(226, 240, 251, 0.8);
        }

        .nav-tabs-custom {
            border-bottom: 1px solid rgba(81, 110, 138, 0.25);
            margin-bottom: 1.25rem;
        }

        .nav-tabs-custom .nav-link {
            border: none;
            border-bottom: 3px solid transparent;
            background: none;
            color: #4e6f8a;
            font-weight: 500;
            padding: 0.8rem 1rem;
            margin-right: 0.25rem;
            transition: all 0.25s ease;
            position: relative;
        }

        .nav-tabs-custom .nav-link:hover {
            color: #2f4e6c;
            background-color: rgba(226, 240, 251, 0.85);
            border-bottom-color: rgba(81, 110, 138, 0.25);
        }

        .nav-tabs-custom .nav-link.active {
            color: #2f4e6c;
            background-color: #e7f3fb;
            border-bottom-color: #6d93b5;
            font-weight: 600;
        }

        .nav-tabs-custom .nav-link.active:hover {
            background-color: #e7f3fb;
        }

        .metric-box,
        .analytics-card,
        .stat-item,
        .step,
        .notification-item {
            border-radius: 16px;
        }

        .metric-box {
            background: #eaf2fa;
            border-left: 4px solid #7a9fc3;
            padding: 1rem;
            min-height: 120px;
        }

        .metric-box .label {
            display: block;
            color: #5c7b95;
            font-size: 13px;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .metric-box .value {
            color: #2f4f72;
            font-size: 1.9rem;
            font-weight: 700;
        }

        .analytics-card {
            border-left: 4px solid #7a9fc3;
            background: linear-gradient(135deg, #e7f3fb 0%, #ffffff 100%);
        }

        .stat-item {
            border-left: 4px solid #81a4c3;
            background: #eef6fb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
        }

        .stat-label {
            color: #4a6c8b;
            font-weight: 600;
        }

        .stat-value {
            color: #2f4f72;
            font-weight: 700;
        }

        .step {
            min-width: 150px;
            padding: 1rem;
            background: #d7e6f3;
            transition: all 0.3s ease;
        }

        .step.active,
        .step.completed {
            background: #aec7dc;
            color: #2e4d69;
        }

        .tooltip-container {
            position: relative;
            display: inline-block;
        }

        .tooltip-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #5f7ea3;
            color: white;
            font-size: 12px;
            border: none;
            cursor: help;
        }

        .tooltip-trigger:hover {
            background-color: #4f6c8f;
            transform: scale(1.05);
        }

        .tooltip-content {
            position: absolute;
            top: 50%;
            left: calc(100% + 0.5rem);
            transform: translateY(-50%);
            background-color: #2d4f72;
            color: #f8f0e4;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 12px;
            white-space: normal;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
            max-width: 260px;
            word-wrap: break-word;
            box-shadow: 0 12px 24px rgba(45, 79, 114, 0.15);
        }

        .tooltip-content::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -6px;
            transform: translateY(-50%);
            border: 6px solid transparent;
            border-right-color: #2d4f72;
        }

        .tooltip-content.show {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(-50%) translateX(0) !important;
        }

        @media (max-width: 768px) {
            .tooltip-content {
                display: none;
            }
        }

        .progress-container {
            margin-top: 0.75rem;
        }

        .btn-primary {
            background-color: #5d8abf;
            border-color: #5d8abf;
            color: #fff;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #5176a6;
            border-color: #5176a6;
        }

        .btn-success {
            background-color: #4f7eab;
            border-color: #4f7eab;
            color: #fff;
        }

        .btn-success:hover,
        .btn-success:focus {
            background-color: #406c92;
            border-color: #406c92;
        }

        .btn-outline-secondary {
            color: #4e6f8a;
            border-color: #a9c0d8;
        }

        .btn-outline-secondary:hover {
            background-color: #e6f0f8;
            color: #2f4f72;
        }

        .btn-danger {
            background-color: #7d5f62;
            border-color: #7d5f62;
            color: #fff;
        }

        .btn-danger:hover,
        .btn-danger:focus {
            background-color: #6d4f55;
            border-color: #6d4f55;
        }

        .text-primary {
            color: #3f5f7c !important;
        }

        .text-success {
            color: #4f7a86 !important;
        }

        .text-warning {
            color: #5a7c95 !important;
        }

        .text-danger {
            color: #7f4d57 !important;
        }

        .alert-custom {
            margin-top: 1rem;
            background: #e6f1fa;
            border: 1px solid rgba(81, 110, 138, 0.18);
        }
    </style>

</head>
<body>

<div class="container-fluid mt-4 content-wrapper">

    <!-- Header -->
    <div class="card shadow-sm mb-4 position-relative">
        <div class="card-body">

            <!-- Название и пример ссылки -->
            <div>
                <h3 class="card-title text-danger mb-2">
                    Phishing Awareness Dashboard
                </h3>

                <!-- Вкладки навигации -->
                <nav class="nav-tabs-custom">
                    <div class="d-flex gap-0 flex-wrap">
                        <a href="/" class="nav-link dashboard active">Dashboard</a>
                        <a href="/emails" class="nav-link emails">Email адреса</a>
                        <a href="/mail-accounts" class="nav-link mail-accounts">Почтовые учетные записи</a>
                        <a href="/mail-sender" class="nav-link mail-sender">Отправка писем</a>
                        <a href="/analytics" class="nav-link analytics">Аналитика</a>
                    </div>
                </nav>

                <p class="mb-1"><b>Пример ссылки:</b></p>
                <code>http://SERVER_IP:8080/track/user123</code>
            </div>

            <!-- Пользователь и кнопка Выйти -->
            <div class="user-logout">
                <div class="text-muted small mb-0">{{ session.username }}</div>
                <a href="/logout" class="btn btn-outline-secondary btn-sm">Выйти</a>
            </div>

        </div>
    </div>

    <!-- Controls -->
    <div class="d-flex justify-content-between align-items-center mb-3 controls flex-wrap gap-2">
        <div>
            <button class="btn btn-danger btn-sm" onclick="deleteSelected()">
                Удалить выбранные
            </button>
        </div>

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <select id="exportFormat" class="form-select form-select-sm" style="width: auto;">
                <option value="">Формат отчёта</option>
                <option value="excel">Excel (.xlsx)</option>
                <option value="txt">TXT (.txt)</option>
                <option value="sql">SQL (.sql)</option>
                <option value="db">SQLite (.db)</option>
            </select>

            <button class="btn btn-success btn-sm" onclick="downloadReport()">
                Скачать
            </button>
        </div>
    </div>

    <!-- Количество записей -->
    <p id="rowCount" class="text-muted"></p>

    <!-- Table -->
    <div class="card shadow-sm table-wrapper">
        <div class="card-body p-0">
            <table class="table table-striped table-hover table-sm mb-0" id="clicksTable">
                <thead class="table-dark">
                    <tr>
                        <th style="width:40px"><input id="selectAll" type="checkbox" aria-label="Выбрать все"></th>
                        <th>Время</th>
                        <th>IP</th>
                        <th>User-Agent</th>
                        <th>Token</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<script>
/* ---------------------------------------
   Загрузка данных и работа с таблицей
--------------------------------------- */
// Набор выбранных id — сохраняем между перезагрузками таблицы
const selectedIds = new Set();

// Делегированный обработчик изменений чекбоксов в таблице
document.addEventListener('change', (e) => {
    const cb = e.target;
    if (!cb) return;

    // Главный чекбокс "Выбрать все"
    if (cb.id === 'selectAll') {
        const checked = cb.checked;
        document.querySelectorAll('#clicksTable tbody input[type="checkbox"]').forEach(c => {
            c.checked = checked;
            const id = String(c.value);
            if (checked) selectedIds.add(id);
            else selectedIds.delete(id);
        });
        return;
    }

    // Индивидуальные чекбоксы в теле таблицы
    if (cb.matches && cb.matches('#clicksTable tbody input[type="checkbox"]')) {
        const id = String(cb.value);
        if (cb.checked) selectedIds.add(id);
        else selectedIds.delete(id);

        // Обновляем состояние главного чекбокса
        const all = document.querySelectorAll('#clicksTable tbody input[type="checkbox"]');
        const checked = document.querySelectorAll('#clicksTable tbody input[type="checkbox"]:checked');
        const selectAll = document.getElementById('selectAll');
        if (selectAll) selectAll.checked = (all.length > 0 && checked.length === all.length);
    }
});

async function loadTable() {
    const res = await fetch('/api/clicks');
    const data = await res.json();

    const tbody = document.querySelector('#clicksTable tbody');
    tbody.innerHTML = '';

    data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" value="${row.id}" ${selectedIds.has(String(row.id)) ? 'checked' : ''}></td>
            <td>${row.timestamp}</td>
            <td>${row.ip}</td>
            <td class="text-truncate ua-col">${row.user_agent}</td>
            <td>${row.token}</td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('rowCount').innerText =
        `Всего записей: ${data.length}`;

    // Обновляем состояние главного чекбокса после перерисовки таблицы
    const all = document.querySelectorAll('#clicksTable tbody input[type="checkbox"]');
    const checked = document.querySelectorAll('#clicksTable tbody input[type="checkbox"]:checked');
    const selectAll = document.getElementById('selectAll');
    if (selectAll) selectAll.checked = (all.length > 0 && checked.length === all.length);
}

async function deleteSelected() {
    const checked = document.querySelectorAll(
        '#clicksTable input[type="checkbox"]:checked'
    );

    if (!checked.length) {
        alert('Выберите записи для удаления');
        return;
    }

    if (!confirm('Удалить выбранные записи?')) return;

    const ids = Array.from(checked).map(cb => cb.value);

    // CSRF защищённый fetch
    await fetch('/api/delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': '{{ csrf_token() }}'
        },
        body: JSON.stringify({ ids })
    });

    // Удаляем удалённые id из набора выбранных, чтобы не пытаться восстановить их при перезагрузке
    ids.forEach(id => selectedIds.delete(String(id)));

    loadTable();
}

function downloadReport() {
    const format = document.getElementById('exportFormat').value;
    if (!format) {
        alert('Выберите формат отчёта');
        return;
    }
    window.location.href = `/export/${format}`;
}

/* ---------------------------------------
   Таймер автовыхода (5 минут неактивности)
--------------------------------------- */
const IDLE_TIMEOUT_MS = 5 * 60 * 1000; // 5 минут в миллисекундах
let idleTimer = null;

// Функция выхода
function logoutUser() {
    alert('Сессия истекла из-за неактивности.');
    window.location.href = '/logout';
}

// Сброс таймера при активности
function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(logoutUser, IDLE_TIMEOUT_MS);
}

// События активности
['mousemove', 'keypress', 'click', 'scroll', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, resetIdleTimer, true);
});

// Инициализация таймера при загрузке страницы
resetIdleTimer();

/* ---------------------------------------
   Инициализация таблицы и событий
--------------------------------------- */
loadTable();
setInterval(loadTable, 5000);

// Плавная подстройка таблицы при изменении окна
window.addEventListener('resize', () => {
    document.querySelector('#clicksTable').style.width = '100%';
});
</script>

</body>
</html>
