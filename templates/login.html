<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body { background-color: #e8f2fa; color: #32475d; }
        .container { max-width: 420px; }
        .card { border-radius: 18px; border: 1px solid rgba(81,110,138,0.18); background: #f5f9fd; box-shadow: 0 14px 30px rgba(73,102,134,0.08); }
        .btn-danger { background-color: #7d5f62; border-color: #7d5f62; }
        .btn-danger:hover { background-color: #6d4f55; border-color: #6d4f55; }
        .form-control { border-radius: 14px; border-color: rgba(81,110,138,0.18); background: #eef5fb; color: #32475d; }
    </style>
</head>
<body>

<div class="container mt-5" style="max-width:400px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="text-center mb-3">Вход</h4>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-danger w-100">Войти</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
